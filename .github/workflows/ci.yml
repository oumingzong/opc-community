name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Content Hub (Cloudflare Worker) ─────────────────────
  content-hub-check:
    name: Content Hub — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./opc-content-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opc-content-hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  content-hub-deploy:
    name: Content Hub — Deploy
    runs-on: ubuntu-latest
    needs: content-hub-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./opc-content-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opc-content-hub/package-lock.json
      - run: npm ci
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply opc_content_hub --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  content-hub-smoke:
    name: Content Hub — Smoke Test
    runs-on: ubuntu-latest
    needs: content-hub-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./opc-content-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opc-content-hub/package-lock.json
      - run: npm ci
      - name: Smoke — Public API
        run: node scripts/smoke-public.mjs --base https://opc-content-hub.2086206051.workers.dev
      - name: Smoke — Health Check
        run: |
          HEALTH=$(curl -s https://opc-content-hub.2086206051.workers.dev/health)
          echo "$HEALTH" | grep -q '"ok":true' && echo "✅ Health OK" || (echo "❌ Health FAIL" && exit 1)
      - name: Smoke — Plaza API
        run: |
          PLAZA=$(curl -s https://opc-content-hub.2086206051.workers.dev/api/plaza/posts)
          echo "$PLAZA" | grep -q '"author"' && echo "✅ Plaza OK" || (echo "⚠️ Plaza SKIP (may be empty)" && exit 0)

  # ── Frontend (Next.js) ─────────────────────────────────
  frontend-check:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./opc-community
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opc-community/package-lock.json
      - run: npm ci
      - run: npm run build
